<!DOCTYPE html>
<html>
<head>
    <title>프로젝트: 카운터 (Counter)</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; }
        .log { background: #333; padding: 20px; border-radius: 10px; height: 200px; overflow-y: scroll; margin: 20px auto; width: 80%; text-align: left; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .warrior { background: #e74c3c; color: white; }
        .hunter { background: #2ecc71; color: white; }
        .wizard { background: #3498db; color: white; }
    </style>
</head>
<body>
    <h1>🎮 프로젝트: 카운터</h1>
    <p>직업을 선택하고 스킬을 테스트해보세요!</p>
    
    <div>
        <button class="warrior" onclick="useSkill('워리어', '근접 공격')">워리어: 공격</button>
        <button class="warrior" onclick="useSkill('워리어', '돌진')">워리어: 이동</button>
        <button class="warrior" onclick="useSkill('워리어', '방어')">워리어: 방어</button>
    </div>
    <div>
        <button class="hunter" onclick="useSkill('헌터', '중거리 공격')">헌터: 공격</button>
        <button class="hunter" onclick="useSkill('헌터', '은신')">헌터: 이동</button>
        <button class="hunter" onclick="useSkill('헌터', '패링/가드')">헌터: 방어</button>
    </div>
    <div>
        <button class="wizard" onclick="useSkill('마법사', '원거리 공격')">마법사: 공격</button>
        <button class="wizard" onclick="useSkill('마법사', '순간이동')">마법사: 이동</button>
        <button class="wizard" onclick="useSkill('마법사', '방어막')">마법사: 방어</button>
    </div>

    <div class="log" id="log">--- 배틀 로그 ---<br></div>

    <script>
        function useSkill(job, skill) {
            const log = document.getElementById('log');
            log.innerHTML += `[${job}]님이 <b>${skill}</b> 스킬을 사용했습니다!<br>`;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
